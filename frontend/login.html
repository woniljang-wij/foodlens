<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | FoodLens AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-green-50 to-green-100 flex items-center justify-center min-h-screen p-4">

    <div class="glass-effect p-10 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.1)] w-full max-w-md border border-white">
        
        <div class="text-center mb-10">
            <div class="inline-block p-4 rounded-2xl bg-green-100 text-3xl mb-4">
                🍜
            </div>
            <h2 class="text-3xl font-extrabold text-gray-800 tracking-tight">
                Chào mừng trở lại!
            </h2>
            <p class="text-gray-500 mt-2 text-sm">Vui lòng nhập thông tin để tiếp tục</p>
        </div>

        <form onsubmit="loginUser(); return false;" class="space-y-5">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1 ml-1">Email</label>
                <input id="email" type="email" placeholder="name@company.com" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition-all duration-200 bg-gray-50/50">
            </div>

            <div>
                <div class="flex justify-between mb-1 ml-1">
                    <label class="text-sm font-medium text-gray-700">Mật khẩu</label>
                    <a href="#" class="text-xs text-green-600 hover:underline">Quên mật khẩu?</a>
                </div>
                <input id="password" type="password" placeholder="••••••••" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition-all duration-200 bg-gray-50/50">
            </div>

            <button type="submit"
                class="w-full bg-green-600 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-green-200 hover:bg-green-700 hover:-translate-y-0.5 transform transition-all duration-200 active:scale-[0.98]">
                Đăng nhập ngay
            </button>

        </form>

        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-gray-200"></span></div>
            <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-400">Hoặc đăng nhập với</span></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button class="flex items-center justify-center py-2.5 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5 h-5 mr-2" alt="Google">
                <span class="text-sm font-medium text-gray-600">Google</span>
            </button>
            <button class="flex items-center justify-center py-2.5 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                <img src="https://www.svgrepo.com/show/512317/github-142.svg" class="w-5 h-5 mr-2" alt="GitHub">
                <span class="text-sm font-medium text-gray-600">GitHub</span>
            </button>
        </div>

        <p class="text-sm mt-8 text-center text-gray-600">
            Bạn chưa có tài khoản? 
            <a href="register.html" class="text-green-600 font-bold hover:underline">Đăng ký miễn phí</a>
        </p>

    </div>

    <script src="js/main.js" defer></script>
</body>
</html>
