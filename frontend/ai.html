<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FoodLens AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  
<body class="ai-page min-h-screen flex flex-col">
    <nav class="glass-nav sticky top-0 z-50 bg-white/70 backdrop-blur-lg border-b border-white/20 shadow-sm">
      <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-black text-green-600 logo-ai flex items-center gap-2">
            <span class="text-3xl">🍜</span> FoodLens
        </h1>
        <div class="flex gap-4">
            <a href="index.html" class="text-slate-600 font-semibold hover:text-green-600 transition">Trang chủ</a>
        </div>
      </div>
    </nav>

    <section class="text-center mt-20 px-4 animate-fadeIn">
      <h1 class="text-6xl font-black text-white mb-6 drop-shadow-2xl tracking-tight">
        AI Nhận Diện <span class="text-green-400">Món Ăn</span>
      </h1>
      <p class="text-white/90 text-xl max-w-2xl mx-auto font-medium drop-shadow-md leading-relaxed">
        Công nghệ thị giác máy tính giúp bạn bóc tách nguyên liệu, 
        tính toán calo và khám phá công thức chỉ trong vài giây.
      </p>
    </section>

    <div class="flex justify-center mt-12 mb-20 px-4">
      <div class="upload-card glass-container p-2 w-full max-w-[480px]">
        <div class="bg-white/90 backdrop-blur-xl rounded-[2rem] p-8 md:p-12 text-center shadow-2xl relative overflow-hidden">
          
          <div id="drop-area" class="upload-box group cursor-pointer border-2 border-dashed border-slate-300 hover:border-green-500 bg-slate-50/50 transition-all duration-300 relative overflow-hidden">
            <input type="file" id="imageInput" class="hidden" accept="image/*" />

            <div id="uploadText" class="upload-placeholder z-10 pointer-events-none">
              <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              </div>
              <p class="text-slate-600 text-lg">Kéo ảnh vào đây hoặc</p>
              <span class="text-green-600 font-bold text-xl block mt-1">Chọn file từ máy</span>
            </div>

            <img id="preview" class="preview-img hidden" />
            <div id="scanLine" class="scan-line hidden"></div>
          </div>

          <button onclick="uploadImage()" id="aiButton" class="ai-btn mt-8 w-full bg-green-600 hover:bg-green-700 py-4 rounded-2xl text-white font-bold text-xl flex items-center justify-center gap-3 active:scale-95 transition-all">
            <span id="aiIcon">🔍</span>
            <span id="aiText">Phân tích ngay</span>
          </button>

          <div id="loading" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center rounded-[2rem]">
            <div class="relative">
                <div class="animate-spin rounded-full h-16 w-16 border-4 border-slate-200 border-t-green-600"></div>
                <div class="absolute inset-0 flex items-center justify-center text-xs font-bold text-green-600">AI</div>
            </div>
            <p class="mt-4 text-slate-800 font-bold animate-pulse text-lg">Đang quét dữ liệu...</p>
          </div>

        </div>
      </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
