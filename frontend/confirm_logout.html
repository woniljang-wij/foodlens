<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận đăng xuất - FoodLens</title>
    <link rel="stylesheet" href="css/logout.css">
</head>
<body>

    <div class="glass-box">
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        </div>

        <h2 class="logout-title">Đăng xuất?</h2>
        <p class="logout-desc">Bạn có chắc chắn muốn thoát khỏi <strong>FoodLens</strong> không?</p>

        <div class="btn-group">
            <button class="btn-confirm" onclick="confirmLogout()">Đăng xuất ngay</button>
            <button class="btn-cancel" onclick="goBack()">Hủy bỏ</button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        function confirmLogout(){
            localStorage.clear();
            window.location.href = "index.html";
        }
        function goBack(){
            window.history.back();
        }
    </script>
</body>
</html>
