<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | FoodLens AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        /* Hiệu ứng focus nhẹ cho input */
        input:focus {
            transform: translateY(-1px);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-green-50 to-green-100 flex items-center justify-center min-h-screen p-6">

    <div class="glass-effect p-10 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.1)] w-full max-w-lg border border-white">
        
        <div class="text-center mb-8">
            <div class="inline-block p-4 rounded-2xl bg-green-100 text-3xl mb-4">
                🌱
            </div>
            <h2 class="text-3xl font-extrabold text-gray-800 tracking-tight">
                Tạo tài khoản mới
            </h2>
            <p class="text-gray-500 mt-2 text-sm">Bắt đầu hành trình khám phá dinh dưỡng cùng FoodLens</p>
        </div>

        <form onsubmit="registerUser(); return false;" class="space-y-4">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1 ml-1">Họ và tên</label>
                <input id="fullname" type="text" placeholder="Nguyễn Văn A" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition-all duration-200 bg-gray-50/50">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1 ml-1">Email</label>
                <input id="email" type="email" placeholder="example@gmail.com" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition-all duration-200 bg-gray-50/50">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 ml-1">Mật khẩu</label>
                    <input id="password" type="password" placeholder="••••••••" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition-all duration-200 bg-gray-50/50">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1 ml-1">Xác nhận</label>
                    <input id="confirm" type="password" placeholder="••••••••" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition-all duration-200 bg-gray-50/50">
                </div>
            </div>

            <div class="flex items-start mt-2 ml-1">
                <div class="flex items-center h-5">
                    <input id="terms" type="checkbox" required class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-green-300 accent-green-600">
                </div>
                <label for="terms" class="ml-2 text-xs text-gray-500">
                    Tôi đồng ý với <a href="#" class="text-green-600 hover:underline">Điều khoản dịch vụ</a> và <a href="#" class="text-green-600 hover:underline">Chính sách bảo mật</a>.
                </label>
            </div>

            <button type="submit"
                class="w-full bg-green-600 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-green-200 hover:bg-green-700 hover:-translate-y-0.5 transform transition-all duration-200 active:scale-[0.98] mt-4">
                Tạo tài khoản
            </button>
        </form>

        <p class="text-sm mt-8 text-center text-gray-600">
            Đã có tài khoản rồi? 
            <a href="login.html" class="text-green-600 font-bold hover:underline">Đăng nhập ngay</a>
        </p>

    </div>

    <script src="js/main.js" defer></script>
</body>
</html>
