<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<title>Đăng ký</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="js/main.js" defer></script>

</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-96">

<h2 class="text-2xl font-bold mb-6 text-center text-green-600">
Đăng ký tài khoản
</h2>

<input id="fullname" placeholder="Họ và tên"
class="w-full border p-2 mb-3 rounded">

<input id="email" placeholder="Email"
class="w-full border p-2 mb-3 rounded">

<input id="password" type="password" placeholder="Mật khẩu"
class="w-full border p-2 mb-3 rounded">

<input id="confirm" type="password" placeholder="Xác nhận mật khẩu"
class="w-full border p-2 mb-5 rounded">

<button onclick="registerUser()"
class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
Đăng ký
</button>

<p class="text-sm mt-4 text-center">
Đã có tài khoản?
<a href="login.html" class="text-green-600">Đăng nhập</a>
</p>

</div>

</body>
</html>
